# Security response headers for the CARLOS front door, served by the WAF's
# nginx (OWASP CRS image). Installed by the Ansible role and mounted
# read-only into the image's http-level include dir (/etc/nginx/conf.d/), so
# these apply to every response the WAF proxies to the app pod — the log view's
# Caddyfile already carries the same set, this closes the gap on the main app.
#
# `always` so the headers are emitted on error responses (4xx/5xx) too, not
# only 2xx/3xx. Values mirror conf/caddy/Caddyfile.template, with ONE
# difference: X-Frame-Options is SAMEORIGIN, not DENY — the CARLOS UI frames
# its own pages (encounter/e-chart panels), which DENY would break.
#
# NOTE: nginx add_header does NOT inherit into a lower block that declares its
# own add_header. If a future CRS image sets response headers in its server/
# location blocks, these http-level ones are suppressed and must move to a
# location-level include (mount as /etc/nginx/templates/... so the entrypoint
# envsubst-includes them). `carlos-ctl check` probes the served HSTS header and
# flags this — verify a live `curl -skI https://<server>/` after first deploy.
# Do not add `server_tokens` here. The CRS image renders that directive from
# `SERVER_TOKENS`, and nginx rejects duplicate declarations.
# No `preload`: submitting to the HSTS preload list is a one-way, browser-
# baked commitment that also forces every current/future subdomain onto
# HTTPS — an operator decision, not a safe default for a self-hosted EMR on
# an arbitrary hostname. Add `; preload` here and submit deliberately if you
# own the domain and want it.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
# CSP split into two headers:
#  1. ENFORCING — only the directives that DON'T break the OSCAR-lineage UI:
#     frame-ancestors (clickjacking, backs up X-Frame-Options),
#     base-uri (blocks <base> tag hijacking), object-src 'none' (kills
#     Flash/plugin vectors). None of these fall back to default-src, so
#     scripts/styles are untouched — safe to enforce today.
add_header Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
#  2. REPORT-ONLY — the script-src experiment. The UI is inline-script/eval
#     heavy so enforcing default-src would break clinical pages; with no
#     report-to endpoint, violations surface in browser consoles only —
#     enough to inventory them per-site before tightening to an enforcing
#     default-src.
add_header Content-Security-Policy-Report-Only "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
# Optional promotion: after validating report-only policy across all supported
# clinical workflows, replace the enforcing header above with the policy below.
# The application still requires `unsafe-inline` and `unsafe-eval`, but the
# policy restricts resource origins. Do not enable both enforcing headers.
#add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob:; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
# The modern replacement for X-Frame-Options' intent plus feature lockdown:
# an EMR front door has no business accessing sensors/camera/mic.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# PHI must not linger in browser/proxy caches. no-store is deliberately applied
# to EVERY front-door response: the OSCAR-lineage app serves clinical data on
# unpredictable routes (no clean static/dynamic split at the WAF), so a
# path-scoped rule would inevitably miss a PHI page. The cost is that genuinely
# static assets are re-fetched — an acceptable trade for a self-hosted EMR
# where no PHI page may survive in a shared cache. (`always` covers error
# responses too; Pragma is the HTTP/1.0 belt to no-store's suspenders.)
add_header Cache-Control "no-store" always;
add_header Pragma "no-cache" always;
